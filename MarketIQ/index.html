<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market IQ</title>
    <!-- Tailwind CSS for Auto-Responsive Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900">

    <!-- Main Background Section (Replaces Tractor Image) -->
<div class="relative min-h-screen w-full bg-cover bg-center md:p-4" 
     style="background-image: linear-gradient(to right, rgba(0, 0, 0, 02.7), rgba(0, 0, 0, 0.3)), url('./images/bg.jpg');">
        
        <!-- White border wrapper for Desktop like in your Figma design -->
        <div class="h-full w-full rounded-none md:rounded-3xl border-0 md:border-[6px] border-white/20 overflow-hidden relative p-5 md:p-10 flex flex-col justify-between">
            
            <!-- Navbar -->
            <nav class="flex items-center justify-between z-10">
               <!-- Logo -->
<div class="flex items-center gap-2 text-2xl font-bold text-white">
    <!-- Unga Logo Image -->
    <img src="./images/logo.png" alt="Market IQ Logo" class="h-10 w-auto">
    
    <!-- Text theva illana keela irukka line-a remove pannidunga -->
    Market <span class="text-green-500">IQ</span>
</div>

                <!-- Desktop Menu (Hidden on Mobile) -->
                <div class="hidden lg:flex items-center gap-8 bg-white/10 backdrop-blur-md px-6 py-2 rounded-full text-white font-medium">
                    <a href="#" class="bg-white text-black px-4 py-1 rounded-full">Home</a>
                    <a href="#" class="hover:text-green-400 transition">About</a>
                    <a href="#" class="hover:text-green-400 transition">Features</a>
                    <a href="#" class="hover:text-green-400 transition">Market</a>
                </div>

                <!-- Right Actions -->
                <div class="hidden md:flex items-center gap-4">
                    <button class="bg-white text-black px-4 py-2 rounded-lg font-semibold text-sm flex items-center gap-2">
                        <i class="fa-solid fa-globe"></i> English <i class="fa-solid fa-chevron-down text-xs"></i>
                    </button>
                    <a href="#" class="text-white font-medium hover:text-green-400">Sign in</a>
                    <a href="#" class="bg-green-600 hover:bg-green-500 text-white px-6 py-2 rounded-lg font-semibold transition shadow-lg shadow-green-500/30">Sign Up</a>
                </div>

                <!-- Mobile Hamburger Menu Icon -->
                <div class="md:hidden text-white text-2xl cursor-pointer">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>

            <!-- Hero Content -->
            <div class="flex-1 flex flex-col justify-center mt-12 md:mt-0 z-10 max-w-3xl">
                <h1 class="text-4xl md:text-6xl lg:text-7xl font-extrabold text-white leading-tight tracking-tight">
                    Grow Smarter.<br>Sell Better.<br>Earn More.
                </h1>
                
                <p class="text-gray-200 mt-6 text-sm md:text-lg max-w-xl leading-relaxed">
                    Track live market prices, compare opportunities across districts, and make confident selling decisions with trusted agricultural market insights.
                </p>

                <!-- Search Bar -->
                <div class="mt-8 flex items-center bg-white rounded-full p-2 w-full max-w-lg shadow-xl">
                    <i class="fa-solid fa-magnifying-glass text-gray-500 ml-4 text-lg"></i>
                    <input type="text" placeholder="Search Crops.." class="flex-1 bg-transparent border-none outline-none px-4 text-gray-800 font-medium w-full">
                    <button class="bg-green-700 hover:bg-green-600 text-white px-6 py-3 rounded-full font-bold transition w-auto">
                        Search
                    </button>
                </div>

                <!-- Action Buttons -->
                <div class="mt-6 flex flex-col sm:flex-row gap-4">
                    <button class="bg-white hover:bg-gray-100 text-black px-6 py-3 rounded-full font-bold flex items-center justify-center gap-3 transition">
                        <i class="fa-solid fa-store text-green-700"></i> Explore Market
                    </button>
                    <button class="bg-white hover:bg-gray-100 text-black px-6 py-3 rounded-full font-bold flex items-center justify-center gap-3 transition">
                        <i class="fa-solid fa-robot text-green-700"></i> Ask AI Assistant
                    </button>
                </div>
            </div>

            <!-- Bottom Stats Bar -->
            <div class="z-10 mt-12 bg-green-950/70 backdrop-blur-md border border-green-500/30 rounded-2xl p-4 md:p-6 w-full max-w-4xl">
                <!-- Mobile auto sets to 2 columns, PC sets to 4 columns -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8 divide-x-0 lg:divide-x divide-green-500/30">
                    
                    <div class="flex items-center gap-4 pl-0 lg:pl-4">
                        <div class="bg-green-600/40 p-3 rounded-full text-green-400">
                            <i class="fa-solid fa-leaf"></i>
                        </div>
                        <div>
                            <div class="text-white font-bold text-lg md:text-xl">100+</div>
                            <div class="text-green-300 text-xs md:text-sm font-semibold uppercase">Crops</div>
                        </div>
                    </div>

                    <div class="flex items-center gap-4 pl-0 lg:pl-6">
                        <div class="bg-green-600/40 p-3 rounded-full text-green-400">
                            <i class="fa-solid fa-shop"></i>
                        </div>
                        <div>
                            <div class="text-white font-bold text-lg md:text-xl">500+</div>
                            <div class="text-green-300 text-xs md:text-sm font-semibold uppercase">Markets</div>
                        </div>
                    </div>

                    <div class="flex items-center gap-4 pl-0 lg:pl-6 mt-4 lg:mt-0">
                        <div class="bg-green-600/40 p-3 rounded-full text-green-400">
                            <i class="fa-solid fa-chart-line"></i>
                        </div>
                        <div>
                            <div class="text-white font-bold text-lg md:text-xl">24 × 7</div>
                            <div class="text-green-300 text-xs md:text-sm font-semibold uppercase">Live Updates</div>
                        </div>
                    </div>

                    <div class="flex items-center gap-4 pl-0 lg:pl-6 mt-4 lg:mt-0">
                        <div class="bg-green-600/40 p-3 rounded-full text-green-400">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>
                        <div>
                            <div class="text-white font-bold text-lg md:text-xl">98%</div>
                            <div class="text-green-300 text-xs md:text-sm font-semibold uppercase">AI Accuracy</div>
                        </div>
                    </div>

                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
